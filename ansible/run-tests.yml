---
- name: Run integration tests
  hosts: "platform_*:&job_id_{{ job_id }}"
  environment:
    FACT_IMAGE_NAME: "{{ fact.image | default(None) }}"

  tasks:
    - name: Install dependencies
      become: true
      community.general.rpm_ostree_pkg:
        apply_live: true
        name:
          - make
          - python3-packaging
          - python3-requests
        state: present

    - name: Login to quay.io
      community.docker.docker_login:
        registry_url: quay.io
        username: "{{ quay.username }}"
        password: "{{ quay.password }}"

    - name: Clone the repo
      ansible.builtin.git:
        repo: https://github.com/stackrox/fact
        dest: ./fact
        version: "{{ fact.version }}"
        update: false

    - name: Install uv
      become: true
      ansible.builtin.shell:
        cmd : |
          set -euo pipefail
          {{ runtime_command }} container create --name uv ghcr.io/astral-sh/uv:0.13.9
          {{ runtime_command }} cp uv:/uv /usr/local/bin

    - name: Install python packages
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          cd "${HOME}/fact"
          /usr/local/bin/uv python install 3.15
          /usr/local/bin/uv venv --python 3.15 --clear .venv
          source .venv/bin/activate
          /usr/local/bin/uv pip install -r tests/requirements.txt

    - block:
      - name: Run tests
        environment:
          FACT_QA_TAG: "{{ qa_tag | default(None) }}"
        ansible.builtin.shell:
          cmd: |
            cd "${HOME}/fact"
            source ".venv/bin/activate"
            make integration-tests
      always:
      - name: Retrieve results
        ansible.builtin.fetch:
          src: "{{ ansible_env.HOME }}/fact/tests/results.xml"
          dest: ../tests/
          flat: true

      - name: Compress log files
        community.general.archive:
          path: "{{ ansible_env.HOME }}/fact/tests/logs"
          dest: "{{ ansible_env.HOME }}/fact/tests/logs.tar.gz"

      - name: Fetch log files
        ansible.builtin.fetch:
          src: "{{ ansible_env.HOME }}/fact/tests/logs.tar.gz"
          dest: ../tests/logs.tar.gz
          flat: true
