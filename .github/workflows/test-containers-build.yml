name: Build integration test containers

on:
  workflow_call:
    outputs:
      qa-tag:
        value: ${{ jobs.determine-qa-tag.outputs.qa-tag }}

jobs:
  should-build-test-containers:
    name: Determine if tests image needs to be built
    runs-on: ubuntu-24.04
    outputs:
      build-image: ${{ (github.event_name != 'schedule' &&
                        (steps.changed.outputs.qa-tag == 'true' ||
                         contains(github.event.pull_request.labels.*.name, 'rebuild-test-container'))) }}

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changed
        with:
          list-files: shell
          base: ${{ github.ref }}

          # Only trigger a rebuild when the QA tag has changed
          filters: |
            qa-tag:
              - tests/containers/QA_TAG

  determine-qa-tag:
    name: Determine QA tag
    runs-on: ubuntu-24.04
    needs:
      - should-build-test-containers
    outputs:
      qa-tag: ${{ steps.qa-tag.outputs.qa-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Determine QA tag
        id: qa-tag
        run: |
          QA_TAG="$(cat "${GITHUB_WORKSPACE}/tests/containers/QA_TAG")"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${{ needs.should-build-test-containers.outputs.build-image }}" == "true" ]]; then
            QA_TAG="${QA_TAG}-$(make tag)"
          fi
          echo "::notice::Using QA tag: ${QA_TAG}"
          echo "qa-tag=${QA_TAG}" >> "$GITHUB_OUTPUT"

  build-test-containers:
    name: Build and push test containers
    runs-on: ubuntu-24.04
    needs:
      - determine-qa-tag
      - should-build-test-containers
    if: needs.should-build-test-containers.outputs.build-image == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'rebuild-test-container')
    env:
      FACT_QA_TAG: ${{ needs.determine-qa-tag.outputs.qa-tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to quay.io/rhacs-eng
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_RHACS_ENG_RW_USERNAME }}
          password: ${{ secrets.QUAY_RHACS_ENG_RW_PASSWORD }}

      - name: Check images already exist
        id: images-exist
        run: |
          manifest_exists() {
            local image=$1 output
            if output=$(docker manifest inspect "${image}" 2>&1); then
              return 0
            elif echo "${output}" | grep -Eiq 'no such manifest:|manifest unknown'; then
              return 1
            else
              printf '%s: %s\n' "${image}" "${output}" >&2
              return 2
            fi
          }

          image_names=$(make --no-print-directory -s \
            -C "${GITHUB_WORKSPACE}/tests/containers" image-names) || exit $?

          EXIST=true
          while IFS= read -r image_name; do
            [[ -z "${image_name}" ]] && continue
            if manifest_exists "${image_name}"; then
              continue
            else
              status=$?
            fi

            if [[ "${status}" -eq 1 ]]; then
              EXIST=false
            else
              exit "${status}"
            fi
          done <<< "${image_names}"

          if [[ "${EXIST}" == false ]]; then
            echo "::notice::At least one test container manifest is absent"
          fi
          echo "exist=${EXIST}" >> "${GITHUB_OUTPUT}"

      - name: Build and Push containers
        if: steps.images-exist.outputs.exist == 'false' || contains(github.event.pull_request.labels.*.name, 'rebuild-test-container')
        env:
          PLATFORM: linux/amd64,linux/arm64
        run: |
          make -C "${GITHUB_WORKSPACE}/tests/containers" build-and-push
