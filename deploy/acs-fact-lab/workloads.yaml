apiVersion: v1
kind: Namespace
metadata:
  name: acs-file-activity-lab
  labels:
    fact.stackrox.io/experiment: acs-policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootfs-writer
  namespace: acs-file-activity-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rootfs-writer
  template:
    metadata:
      labels:
        app: rootfs-writer
        fact.stackrox.io/scope: rootfs
    spec:
      automountServiceAccountToken: false
      containers:
        - name: writer
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: [/bin/sh, -c, sleep infinity]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emptydir-writer
  namespace: acs-file-activity-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emptydir-writer
  template:
    metadata:
      labels:
        app: emptydir-writer
        fact.stackrox.io/scope: emptydir
    spec:
      automountServiceAccountToken: false
      containers:
        - name: writer
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: [/bin/sh, -c, sleep infinity]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir: {}
