[package]
name = "fact"
version = "0.2.0"
edition = "2021"

license.workspace = true

[dependencies]
anyhow = { workspace = true }
aya = { workspace = true }
clap = { version = "4.5.41", features = ["derive", "env"] }
env_logger = { version = "0.11.5", default-features = false, features = ["humantime"] }
http-body-util = "0.1.3"
hyper = { version = "1.6.0", default-features = false }
hyper-tls = "0.6.0"
hyper-util = { version = "0.1.16", default-features = false }
libc = { workspace = true }
log = { version = "0.4.22", default-features = false }
native-tls = { version = "0.2.14", features = ["alpn"] }
openssl = "0.10.75"
tonic = { workspace = true }
tokio = { workspace = true }
tokio-native-tls = "0.3.1"
tokio-stream = { version = "0.1.17", features = ["sync"] }
prometheus-client = { version = "0.25.0", default-features = false }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.142"
uuid = { version = "1.17.0", features = ["v4"] }
yaml-rust2 = "0.12.0"

fact-api = { path = "../fact-api" }
fact-ebpf = { path = "../fact-ebpf" }

[dev-dependencies]
tempfile = { version = "3.20.0", default-features = false }

[build-dependencies]
anyhow = { workspace = true }

[[bin]]
name = "fact"
path = "src/main.rs"

[features]
bpf-test = []
