[package]
name = "fact"
version = "0.3.0"
edition = "2024"

license.workspace = true

[dependencies]
anyhow = { workspace = true }
aya = { workspace = true }
clap = { version = "=4.6.7", features = ["derive", "env"] }
env_logger = { version = "=0.11.11", default-features = false, features = ["humantime"] }
glob = "=0.3.4"
globset = "=0.4.20"
governor = "=0.10.4"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false }
hyper-tls = "=0.6.0"
hyper-util = { version = "=0.1.21", default-features = false }
libc = { workspace = true }
log = { version = "=0.4.34", default-features = false }
native-tls = { version = "=0.2.18", features = ["alpn"] }
openssl = "=0.10.81"
tonic = { workspace = true }
tokio = { workspace = true }
tokio-native-tls = "=0.3.1"
tokio-stream = { version = "=0.1.19", features = ["sync"] }
prometheus-client = { version = "=0.25.1", default-features = false }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = "=1.0.154"
shlex = "=2.0.1"
uuid = { version = "=1.29.0", features = ["v4"] }
yaml-rust2 = "=0.13.0"

fact-api = { path = "../fact-api" }
fact-ebpf = { path = "../fact-ebpf" }

[dev-dependencies]
tempfile = { version = "=3.27.0", default-features = false }
regex = "=1.13.1"

[build-dependencies]
anyhow = { workspace = true }

[[bin]]
name = "fact"
path = "src/main.rs"

[features]
bpf-test = []
