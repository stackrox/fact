#cloud-config
# Cloud-init user-data for Ubuntu (24.04+).
# Used by hack/qemu-vm.sh — __SSH_PUBKEY__ is replaced at boot time.
#
# NOTE: Ubuntu uses AppArmor by default; the LSM list must include it
# alongside bpf.  The grubby tool is not available — use GRUB config
# directly.

users:
  - name: root
    lock_passwd: false
    ssh_authorized_keys:
      - __SSH_PUBKEY__

ssh_pwauth: false

runcmd:
  - sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="lsm=lockdown,capability,yama,apparmor,bpf"/' /etc/default/grub
  - update-grub
  - apt-get update -qq
  - apt-get install -y -qq ca-certificates curl
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -qq
  - apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin
  - systemctl enable --now docker
  - touch /var/lib/cloud/instance/boot-finished-user
